<html>

<style>

    #squinka {
        position: absolute;

    }

    #fish {
        position: absolute;
        width: 40px;
        height: 40px;
        left: 400px;

        font-size: 35px;
        line-height: 40px;
    }

        font-size: 24px;
        font-weight: bold;
    }

    /* ARROW CONTROLS */
    #controls {
        width: 210px;
        margin: 20px auto;
        display: grid;
        grid-template-columns: 65px 65px 65px;
        grid-template-rows: 65px 65px;
        gap: 5px;
        justify-content: center;
    }

    .control-button {
        width: 65px;
        height: 65px;
        font-size: 32px;
        font-weight: bold;
        background-color: blue;
        color: white;
        border: 3px solid black;
        border-radius: 12px;
        cursor: pointer;
        touch-action: none;
        user-select: none;
    }

    .control-button:active {
        background-color: darkblue;
        transform: scale(0.95);
    }

    #up {
        grid-column: 2;
        grid-row: 1;

        grid-column: 1;
        grid-row: 2;

        grid-column: 3;
        grid-row: 2;

<body>

```
<h1>🐱 Squinka's Fish Game 🐟</h1>

<div id="score">Score: 0</div>

<div id="game">
    <div id="squinka">🐱</div>
    <div id="fish">🐟</div>
</div>

<!-- ARROW KEYS -->
<div id="controls">

    <button class="control-button" id="up">⬆️</button>

    <button class="control-button" id="left">⬅️</button>

    <button class="control-button" id="down">⬇️</button>

    <button class="control-button" id="right">➡️</button>

</div>

<button id="backButton" onclick="window.location.href='index.html';">
    Back to Main Page
</button>




<script>

    let squinka = document.getElementById("squinka");
    let fish = document.getElementById("fish");
    let scoreText = document.getElementById("score");

    let x = 50;
    let y = 50;
    let score = 0;

    let fishX = 400;
    let fishY = 250;

    let keys = {};


    /* COMPUTER ARROW KEYS */

    document.addEventListener("keydown", function(event) {

        if (
            event.key === "ArrowRight" ||
            event.key === "ArrowLeft" ||
            event.key === "ArrowUp" ||
            event.key === "ArrowDown"
        ) {
            event.preventDefault();
        }

        keys[event.key] = true;
    });

    document.addEventListener("keyup", function(event) {
        keys[event.key] = false;
    });


    /* ON-SCREEN BUTTONS */

    function setupButton(buttonID, keyName) {

        let button = document.getElementById(buttonID);

        button.addEventListener("mousedown", function(event) {
            event.preventDefault();
            keys[keyName] = true;
        });

        button.addEventListener("mouseup", function(event) {
            event.preventDefault();
            keys[keyName] = false;
        });

        button.addEventListener("mouseleave", function() {
            keys[keyName] = false;
        });

        button.addEventListener("touchstart", function(event) {
            event.preventDefault();
            keys[keyName] = true;
        });

        button.addEventListener("touchend", function(event) {
            event.preventDefault();
            keys[keyName] = false;
        });

        button.addEventListener("touchcancel", function(event) {
            event.preventDefault();
            keys[keyName] = false;
        });
    }


    setupButton("up", "ArrowUp");
    setupButton("down", "ArrowDown");
    setupButton("left", "ArrowLeft");
    setupButton("right", "ArrowRight");


    /* CHECK FISH */

    function checkFish() {

        let squinkaCenterX = x + 35;
        let squinkaCenterY = y + 35;

        let fishCenterX = fishX + 20;
        let fishCenterY = fishY + 20;

        let distanceX = Math.abs(squinkaCenterX - fishCenterX);
        let distanceY = Math.abs(squinkaCenterY - fishCenterY);

        if (distanceX < 30 && distanceY < 30) {

            score++;

            scoreText.textContent = "Score: " + score;

            fishX = Math.floor(Math.random() * 550);
            fishY = Math.floor(Math.random() * 350);

            fish.style.left = fishX + "px";
            fish.style.top = fishY + "px";
        }
    }


    /* MOVE SQUINKA */

    function moveSquinka() {

        let speed = 4;

        if (keys["ArrowRight"]) {
            x += speed;
        }

        if (keys["ArrowLeft"]) {
            x -= speed;
        }

        if (keys["ArrowUp"]) {
            y -= speed;
        }

        if (keys["ArrowDown"]) {
            y += speed;
        }

        if (x < 0) x = 0;
        if (x > 530) x = 530;

        if (y < 0) y = 0;
        if (y > 330) y = 330;

        squinka.style.left = x + "px";
        squinka.style.top = y + "px";

        checkFish();

        requestAnimationFrame(moveSquinka);
    }

    moveSquinka();

</script>

</body>
</html>
